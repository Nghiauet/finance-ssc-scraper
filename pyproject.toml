[project]
name = "scrape-ssc"
version = "0.1.0"
description = "Scrape financial reports from Vietnam's State Securities Commission (SSC)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.58.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "minio>=7.2.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "aiofiles>=23.0.0",
    "PyMuPDF>=1.24.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "tiktoken>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
scrape-ssc = "scrape_ssc.cli:main"
ssc-api = "app.main:run"
