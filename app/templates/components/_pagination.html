{% if total_pages > 1 %}
<nav class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6 rounded-b-xl" aria-label="Pagination">
  <div class="hidden sm:block">
    <p class="text-sm text-gray-700">
      Showing page <span class="font-medium">{{ page }}</span> of <span class="font-medium">{{ total_pages }}</span>
      <span class="text-gray-500">({{ total }} total)</span>
    </p>
  </div>
  <div class="flex flex-1 justify-between sm:justify-end space-x-2">
    {% if page > 1 %}
    <a href="?{{ query_string }}&page={{ page - 1 }}" class="inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-medium text-gray-700 ring-1 ring-gray-300 hover:bg-gray-50 transition-colors">Previous</a>
    {% endif %}
    {% if page < total_pages %}
    <a href="?{{ query_string }}&page={{ page + 1 }}" class="inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-medium text-gray-700 ring-1 ring-gray-300 hover:bg-gray-50 transition-colors">Next</a>
    {% endif %}
  </div>
</nav>
{% endif %}
