<div class="text-center py-12">
  <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
  </svg>
  <h3 class="mt-2 text-sm font-semibold text-gray-900">{{ title | default("No data") }}</h3>
  <p class="mt-1 text-sm text-gray-500">{{ message | default("Get started by creating something new.") }}</p>
  {% if action_url %}
  <div class="mt-6">
    <a href="{{ action_url if '://' in action_url else app_path(request, action_url) }}" class="inline-flex items-center rounded-md bg-primary-600 px-3 py-2 text-sm font-semibold text-white hover:bg-primary-500 transition-colors">
      {{ action_label | default("Get started") }}
    </a>
  </div>
  {% endif %}
</div>
